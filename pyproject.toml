[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "switchboard"
version = "1.0.0"
description = "chat server accessed over ssh"
requires-python = ">=3.11"
dependencies = ["asyncssh==2.24.0"]

[project.scripts]
switchboard = "switchboard.cli:main"

[tool.setuptools.packages.find]
include = ["switchboard*"]